<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 20分钟速学</title>
<style>
:root{--bg:#F7F7F5;--card:#FFFFFF;--ink:#1A1A18;--muted:#6B6B66;--faint:#9A9A93;--line:#E4E3DE;--accent:#185FA5;--accent-soft:#E6F1FB}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:48px 44px;max-width:520px;text-align:center}
.code{font-family:ui-monospace,Consolas,monospace;font-size:64px;font-weight:600;color:var(--accent-soft);line-height:1;letter-spacing:-2px}
h1{font-size:22px;font-weight:600;margin-top:14px;letter-spacing:-.2px}
p{color:var(--muted);margin-top:12px;font-size:14px}
a{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;text-decoration:none;padding:11px 26px;border-radius:9px;font-size:14px;font-weight:500;transition:.15s}
a:hover{opacity:.88}
.hint{margin-top:20px;font-size:13px;color:var(--faint)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这一页不存在</h1>
    <p>可能是链接写错了，或者这份文档还没写。</p>
    <a href="/">回到首页</a>
    <div class="hint">首页有搜索框，直接搜关键词更快。</div>
  </div>
</body>
</html>
